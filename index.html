<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>EasiMaths</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EasiMaths">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0b1e">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/39ff14/000000?text=E">

    <style>
        :root { --neon-green: #39ff14; --space-blue: #0a0b1e; --star-gold: #ffd700; }
        body { margin: 0; background: var(--space-blue); color: white; font-family: 'Arial', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .screen { display: none; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }
        
        #start-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--space-blue); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .start-btn { padding: 25px 60px; font-size: 30px; background: var(--neon-green); color: black; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }

        .map-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 100%; max-width: 600px; margin-top: 10px; padding-bottom: 40px; }
        .planet { width: 80px; height: 80px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; border: 2px solid rgba(255,255,255,0.2); transition: 0.2s; flex-shrink: 0; position: relative;}
        .planet span { position: absolute; bottom: -20px; font-size: 10px; color: #888; white-space: nowrap; }
        
        .planet.random { background: linear-gradient(45deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff) !important; width: 100px; height: 100px; border: 3px solid white; font-size: 14px; text-align: center; line-height: 1.1; margin-top: 10px; }

        #game-box { width: 100%; max-width: 450px; padding: 30px; border: 2px solid var(--neon-green); border-radius: 30px; background: rgba(0,0,0,0.9); text-align: center; box-sizing: border-box; }
        input[type="number"] { background: transparent; border: none; border-bottom: 4px solid var(--star-gold); color: var(--star-gold); font-size: 70px; text-align: center; width: 160px; outline: none; }
        .progress-container { width: 100%; background: #222; height: 10px; border-radius: 10px; margin-bottom: 15px; }
        #progress-bar { width: 0%; height: 100%; background: var(--neon-green); transition: 0.1s; }
        #counter { font-size: 12px; color: var(--star-gold); margin-top: 5px; }
    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: var(--star-gold);">EasiMaths</h1>
        <button class="start-btn" onclick="bootSystem()">START</button>
    </div>

    <div id="map-screen" class="screen">
        <h2 style="color: var(--star-gold); margin-bottom: 5px;">EasiMaths Galaxy</h2>
        <p style="font-size: 14px; margin-bottom: 15px;">Target: Complete all tables 2x1 to 12x12!</p>
        <div class="map-container" id="planet-list"></div>
    </div>

    <div id="game-screen" class="screen">
        <div id="game-box">
            <div onclick="showMap()" style="cursor:pointer; color:var(--neon-green); text-align: left; margin-bottom: 10px; font-weight: bold;">⬅ MAP</div>
            <div class="progress-container"><div id="progress-bar"></div></div>
            <div id="counter">Question 1 of 132</div>
            <div id="question" style="font-size: 65px; font-weight: bold; margin: 10px 0;">-- × --</div>
            <input type="number" id="answer-input" pattern="\d*" inputmode="numeric" autocomplete="off">
            <p id="feedback" style="height: 30px; font-weight: bold; margin-top: 20px; font-size: 22px;"></p>
        </div>
    </div>

    <script>
        let currentTable, currentAnswer, solvedCount = 0, missionQueue = [];
        let isRandomMode = false;
        let audioCtx;
        const inputField = document.getElementById('answer-input');

        function bootSystem() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('map-screen').classList.add('active');
            renderPlanets();
        }

        function playDing() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function playCrash() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function renderPlanets() {
            const colors = ['#ff5f6d', '#ffc371', '#ee9ca7', '#4facfe', '#00f2fe', '#a18cd1', '#fbc2eb', '#84fab0', '#5ee7df', '#fccb90', '#d299c2'];
            const list = document.getElementById('planet-list');
            list.innerHTML = "";
            for(let i=2; i<=12; i++) {
                let p = document.createElement('div');
                p.className = 'planet';
                p.style.background = `radial-gradient(circle at 30% 30%, ${colors[i-2]}, #000)`;
                p.innerHTML = `${i}x<span>Planet ${i}</span>`;
                p.onclick = () => startLevel(i);
                list.appendChild(p);
            }
            // Add THE GRAND RANDOMIZER
            let r = document.createElement('div');
            r.className = 'planet random';
            r.innerHTML = "GRAND<br>RANDOMIZER";
            r.onclick = () => startRandomLevel();
            list.appendChild(r);
        }

        function startLevel(table) {
            isRandomMode = false;
            currentTable = table;
            solvedCount = 0;
            missionQueue = Array.from({length: 12}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
            document.getElementById('map-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            nextQuestion();
        }

        function startRandomLevel() {
            isRandomMode = true;
            solvedCount = 0;
            missionQueue = [];
            
            // Build every single combination from 2x1 up to 12x12
            for(let t=2; t<=12; t++) {
                for(let m=1; m<=12; m++) {
                    missionQueue.push({t: t, m: m});
                }
            }
            // Shuffle them completely
            missionQueue.sort(() => Math.random() - 0.5);

            document.getElementById('map-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');
            nextQuestion();
        }

        function nextQuestion() {
            inputField.value = "";
            const total = isRandomMode ? 132 : 12;
            
            if(isRandomMode) {
                let q = missionQueue[solvedCount];
                currentTable = q.t;
                currentAnswer = q.t * q.m;
                document.getElementById('question').innerText = `${q.t} × ${q.m}`;
            } else {
                let mult = missionQueue[solvedCount];
                currentAnswer = currentTable * mult;
                document.getElementById('question').innerText = `${currentTable} × ${mult}`;
            }
            
            document.getElementById('feedback').innerText = "";
            document.getElementById('counter').innerText = `Question ${solvedCount + 1} of ${total}`;
            document.getElementById('progress-bar').style.width = (solvedCount / total * 100) + "%";
            setTimeout(() => inputField.focus(), 50);
        }

        inputField.addEventListener("input", function() {
            const valStr = inputField.value;
            const valNum = parseInt(valStr);

            // Automatic check once correct number of digits are entered
            if (valStr.length >= currentAnswer.toString().length) {
                if (valNum === currentAnswer) {
                    playDing();
                    document.getElementById('feedback').innerText = "⭐ CORRECT!";
                    document.getElementById('feedback').style.color = "var(--neon-green)";
                    solvedCount++;
                    const total = isRandomMode ? 132 : 12;
                    if(solvedCount >= total) {
                        setTimeout(() => { alert("MISSION MASTERED! You cleared the Galaxy!"); showMap(); }, 400);
                    } else {
                        setTimeout(nextQuestion, 400);
                    }
                } else {
                    playCrash();
                    document.getElementById('feedback').innerText = "❌ TRY AGAIN";
                    document.getElementById('feedback').style.color = "#ff073a";
                    inputField.value = ""; 
                }
            }
        });

        function showMap() {
            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('map-screen').classList.add('active');
        }
    </script>
</body>
</html>
